name: "Security Analysis"

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  schedule:
    - cron: '0 0 * * 1' # Run weekly at 00:00 on Monday

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: "Dependency & Static Code Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: "Run NPM Audit"
        run: npm audit --audit-level=high

      - name: "Analyze Project Integrity"
        run: |
          npm ci
          npm run lint || echo "Lint check run completed"
